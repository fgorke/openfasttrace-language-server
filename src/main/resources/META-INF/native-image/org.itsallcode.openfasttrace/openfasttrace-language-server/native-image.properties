# Picked up by GraalVM Native Image from every classpath entry that carries this file, so both
# `mvn -Pnative package` and `native-image -jar openfasttrace-language-server-*-standalone.jar`
# build a working binary without further options.
#
# -march=compatibility: the released binaries run on any x86-64 or AArch64 machine, not only on
# CPUs as new as the build machine.
Args = --features=org.itsallcode.openfasttrace.lsp.nativeimage.NativeImageSupport \
       --no-fallback \
       -march=compatibility
