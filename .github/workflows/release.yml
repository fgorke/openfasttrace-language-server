name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vscode-packages:
    name: Build VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('This workflow must run on main. Current ref: ${{ github.ref }}')

      - name: Set up JDK 25 for Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Build VS Code extension package
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npm run package -- ${{ matrix.target }}

      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension-${{ matrix.target }}
          path: vscode-extension/*.vsix

  native-binaries:
    name: Build native binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('This workflow must run on main. Current ref: ${{ github.ref }}')

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven

      - name: Build native binary
        run: mvn --batch-mode -DskipTests -Pnative package

      - name: Smoke test the binary against the demo project
        shell: bash
        run: ./.github/workflows/native_smoke_test.sh doc/demo/example target/openfasttrace-language-server

      - name: Name the binary after version and platform
        shell: bash
        run: |
          version=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' pom.xml | head -n 1)
          extension=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then extension=".exe"; fi
          mkdir -p target/native
          mv "target/openfasttrace-language-server${extension}" \
             "target/native/openfasttrace-language-server-${version}-${{ matrix.target }}${extension}"

      - name: Upload native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-binary-${{ matrix.target }}
          path: target/native/*

  release:
    runs-on: ubuntu-latest
    needs: [vscode-packages, native-binaries]
    defaults:
      run:
        shell: bash
    env:
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('This workflow must run on main. Current ref: ${{ github.ref }}')

      - name: Set up JDK 25 for Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      # Gradle 9.0 does not run on Java 25 yet; the plugin itself targets the IDE's 17 toolchain.
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build plugin distribution
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Download platform-specific extension packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vscode-extension-*
          path: vscode-extension
          merge-multiple: true

      - name: Download native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-binary-*
          path: target/native
          merge-multiple: true

      - name: Create GitHub release
        run: bash ./.github/workflows/github_release.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        if: ${{ env.OVSX_PAT != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode-extension
        run: |
          for package in *.vsix; do
            echo "Publishing $package"
            npx --yes ovsx publish "$package"
          done
