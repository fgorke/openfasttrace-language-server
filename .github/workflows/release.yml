name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vscode-packages:
    name: Build VS Code extension (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('This workflow must run on main. Current ref: ${{ github.ref }}')

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build VS Code extension package
        working-directory: vscode-extension
        shell: bash
        run: |
          npm ci
          npm run package -- ${{ matrix.target }}

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.target }}
          path: vscode-extension/*.vsix

  release:
    runs-on: ubuntu-latest
    needs: vscode-packages
    defaults:
      run:
        shell: bash
    env:
      OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if not running on main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('This workflow must run on main. Current ref: ${{ github.ref }}')

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build standalone server JAR
        run: mvn --batch-mode -DskipTests package

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build plugin distribution
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Download platform-specific extension packages
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-extension-*
          path: vscode-extension
          merge-multiple: true

      - name: Create GitHub release
        run: bash ./.github/workflows/github_release.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        if: ${{ env.OVSX_PAT != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish to Open VSX Registry
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode-extension
        run: npx --yes ovsx publish *.vsix


